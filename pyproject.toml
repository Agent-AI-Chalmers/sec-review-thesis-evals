[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"
timeout = 120

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "E402"]

[tool.black]
target-version = ["py314"]
line-length = 88
